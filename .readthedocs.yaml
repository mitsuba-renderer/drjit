version: 2

submodules:
  include: all
  recursive: true

build:
  os: ubuntu-24.04
  apt_packages:
    - librsvg2-bin
    - libllvm18
  tools:
    python: "3.11"

sphinx:
   configuration: docs/conf.py

python:
   install:
   - requirements: docs/requirements.txt
   - method: pip
     path: .

formats:
  - pdf
